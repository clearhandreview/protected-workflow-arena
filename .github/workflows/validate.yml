name: validate

on:
  push:
  pull_request:

jobs:
  public-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 cli/arena.py validate --kind ai --file examples/ai-workflow.json
      - run: python3 cli/arena.py validate --kind kubernetes --file examples/kubernetes-job.yaml
